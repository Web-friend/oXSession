[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
napi = { version = "3", features = ["async"] }
napi-derive = "3"
napi-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
oxsession-core = { path = "crates/oxsession-core" }
oxsession-axum = { path = "crates/oxsession-axum" }
oxsession-session = { path = "crates/oxsession-session" }
oxsession-sign = { path = "crates/oxsession-sign" }
