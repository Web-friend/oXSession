name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate agent setup
        run: python3 scripts/validate-agent-setup.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Node addon
        run: npm run build --prefix crates/oxsession-node
      - name: Check Node.js entry point
        run: node --check crates/oxsession-node/index.js
      - name: Build documentation
        run: cargo doc --workspace --no-deps
